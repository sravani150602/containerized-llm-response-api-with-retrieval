# One command brings up the whole stack:
#   docker compose up --build
# api   -> FastAPI + LoRA-tuned LLM  (http://localhost:8000, Swagger at /docs)
# redis -> response cache
# minio -> S3-compatible object storage holding the knowledge base (console: http://localhost:9001)
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports: ["8000:8000"]
    environment:
      LLM_BACKEND: hf
      BASE_MODEL: ${BASE_MODEL:-HuggingFaceTB/SmolLM2-360M-Instruct}
      ADAPTER_PATH: artifacts/lora-adapter
      STORAGE_BACKEND: s3
      S3_BUCKET: llm-rag-knowledge-base
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      REDIS_URL: redis://redis:6379/0
    volumes:
      - hf-cache:/models/hf-cache        # model weights are downloaded once and reused
      - ./artifacts:/srv/artifacts:ro     # mount your trained LoRA adapter
    depends_on:
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  # one-shot job: create the bucket and upload ./knowledge_base into s3://llm-rag-knowledge-base/kb/
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    volumes: [./knowledge_base:/kb:ro]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/llm-rag-knowledge-base &&
      mc mirror --overwrite /kb local/llm-rag-knowledge-base/kb &&
      echo 'knowledge base uploaded'"

volumes:
  hf-cache:
  minio-data:
